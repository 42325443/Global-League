# CI de Global League: lint -> unit -> integration -> e2e -> postman -> load-test.
# Espeja jenkins/Jenkinsfile. Los reportes JUnit quedan en test-reports/.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint .

  unit-frontend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run --coverage --reporter=junit --outputFile=test-reports/vitest-frontend.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-frontend
          path: test-reports/vitest-frontend.xml

  integration-backend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      # NOTA: no se usa `npm test` (placeholder que falla); se invoca vitest directo.
      - run: npx vitest run --coverage --reporter=junit --outputFile=../test-reports/vitest-backend.xml
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-backend
          path: test-reports/vitest-backend.xml

  e2e:
    runs-on: ubuntu-latest
    needs: [unit-frontend, integration-backend]
    steps:
      - run: echo "E2E pendiente de definir (Playwright/Cypress). Job reservado."

  postman:
    runs-on: ubuntu-latest
    needs: [unit-frontend, integration-backend]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          # El schema.sql crea/usa la base `global_league`, por eso se alinea aquí.
          MYSQL_DATABASE: global_league
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      PORT: 3000
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: global_league
      AUTH_SECRET: ci-test-secret
      BASE_URL: http://localhost:3000/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias del root y backend
        run: |
          npm ci
          npm ci --prefix backend

      # Red de seguridad: garantiza LF en TODOS los scripts .sh.
      # (.gitattributes ya normaliza en el checkout, pero esto cubre cualquier
      # editor/OS que reintroduzca CRLF y evita el error "pipefail: invalid option name".)
      - name: Normalizar finales de linea de los scripts (CRLF a LF)
        run: |
          for f in scripts/*.sh; do
            sed -i 's/\r$//' "$f"
            chmod +x "$f"
          done

      - name: Instalar Newman (CLI de Postman)
        run: npm install -g newman

      - name: Instalar cliente MySQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: Sembrar esquema y catalogos en MySQL
        run: |
          echo "Esperando a que MySQL acepte conexiones..."
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent >/dev/null 2>&1; then
              echo "MySQL listo."
              break
            fi
            echo "  ...intento $i/30"
            sleep 2
          done
          mysql -h 127.0.0.1 -uroot -proot < database/schema.sql
          mysql -h 127.0.0.1 -uroot -proot global_league < database/seed.sql
          mysql -h 127.0.0.1 -uroot -proot global_league < tests/test-db-seed.sql
          echo "Esquema, catalogos y torneo de prueba sembrados correctamente."

      - name: Levantar el backend en segundo plano
        run: |
          npm start &
          echo "Esperando a que la API responda..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:3000/api/catalogos/deportes; then
              echo "Backend listo tras ~$((i*2))s."
              exit 0
            fi
            echo "  ...intento $i/30"
            sleep 2
          done
          echo "El backend no respondio a tiempo."
          exit 1
        working-directory: backend

      - name: Ejecutar pruebas de Postman con Newman
        run: bash scripts/run-newman.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-reports
          path: |
            test-reports/newman.xml
            test-reports/newman.html


  load-test:
    runs-on: ubuntu-latest
    needs: postman
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - run: BASE_URL=http://localhost:3000/api k6 run --summary-export=test-reports/k6-summary.json scripts/load-test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-summary
          path: test-reports/k6-summary.json
