# CI de Global League: lint -> unit -> integration -> e2e -> postman -> load-test.
# Espeja jenkins/Jenkinsfile. Los reportes JUnit quedan en test-reports/.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint .

  unit-frontend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run --coverage --reporter=junit --outputFile=test-reports/vitest-frontend.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-frontend
          path: test-reports/vitest-frontend.xml

  integration-backend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      # NOTA: no se usa `npm test` (placeholder que falla); se invoca vitest directo.
      - run: npx vitest run --coverage --reporter=junit --outputFile=../test-reports/vitest-backend.xml
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-backend
          path: test-reports/vitest-backend.xml

  e2e:
    runs-on: ubuntu-latest
    needs: [unit-frontend, integration-backend]
    steps:
      - run: echo "E2E pendiente de definir (Playwright/Cypress). Job reservado."

  postman:
    runs-on: ubuntu-latest
    needs: [unit-frontend, integration-backend]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: global_league_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - run: npm install -g newman
      - run: bash scripts/run-newman.sh
        env:
          BASE_URL: http://localhost:3000/api
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: global_league_test
          AUTH_SECRET: ci-test-secret
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-reports
          path: |
            test-reports/newman.xml
            test-reports/newman.html

  load-test:
    runs-on: ubuntu-latest
    needs: postman
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - run: BASE_URL=http://localhost:3000/api k6 run --summary-export=test-reports/k6-summary.json scripts/load-test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-summary
          path: test-reports/k6-summary.json
